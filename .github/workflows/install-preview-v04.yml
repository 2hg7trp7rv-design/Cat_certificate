name: Install Tail Room Preview v0.4

on:
  push:
    branches:
      - main
    paths:
      - 'Cat_certificate2.zip.b64.*'
      - '.github/workflows/install-preview-v04.yml'

permissions:
  contents: write

concurrency:
  group: install-tail-room-preview-v04
  cancel-in-progress: false

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Reconstruct and install source archive
        shell: bash
        run: |
          set -euo pipefail
          cat Cat_certificate2.zip.b64.* > /tmp/Cat_certificate2.zip.b64
          base64 --decode /tmp/Cat_certificate2.zip.b64 > /tmp/Cat_certificate2.zip
          unzip -t /tmp/Cat_certificate2.zip

          rm -rf \
            creator.html \
            public \
            privacy.html \
            capacitor.config.json \
            src \
            scripts \
            tests \
            docs \
            dist \
            node_modules
          rm -f \
            index.html \
            package.json \
            package-lock.json \
            vercel.json \
            robots.txt \
            README.md

          unzip -o /tmp/Cat_certificate2.zip -d .
          rm -f Cat_certificate2.zip.b64.*
          rm -f .github/workflows/install-preview-v04.yml

      - name: Verify rebuilt creator preview
        run: |
          npm ci --no-audit --no-fund
          npm run check

      - name: Commit verified rebuild
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Rebuild Tail Room creator preview 0.4.0'
          git push origin HEAD:main
