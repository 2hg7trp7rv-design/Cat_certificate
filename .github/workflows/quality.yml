name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Japanese screenshot font
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes fonts-noto-cjk
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: tail-room-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
      - name: WebGL browser smoke
        run: npm run smoke
      - name: Upload v0.8 WebGL smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tail-room-v0.8-webgl-smoke
          path: artifacts/v0.8
          if-no-files-found: warn
          retention-days: 90
