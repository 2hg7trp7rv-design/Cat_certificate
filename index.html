<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171411">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Tail Room — Creator Preview 0.6</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
<div id="app" class="app" data-phase="day">
  <section id="intro" class="screen intro-screen">
    <div class="scene scene-intro" aria-hidden="true"></div>
    <div class="shade shade-intro" aria-hidden="true"></div>
    <header class="intro-copy"><span class="brand">TAIL ROOM</span><h1>この子と、<br>暮らしはじめる。</h1><p>まずは名前より先に、そっと触れてみてください。</p></header>
    <button id="introCat" class="cat-zone intro-cat-zone" type="button" aria-label="子猫に触れる"></button>
    <div id="touchGuide" class="touch-guide"><span></span><b>指でゆっくり撫でる</b></div>
    <section id="namePanel" class="sheet name-sheet" hidden><p class="kicker">この子を呼ぶ名前</p><h2>名前をつける</h2><input id="petNameInput" maxlength="10" value="こむぎ" autocomplete="off" aria-label="ペットの名前"><button id="startLife" class="primary" type="button">暮らしを始める</button><p>生活時間は、暮らし始めてから変更できます。</p></section>
  </section>
  <section id="home" class="screen home-screen hidden">
    <div id="homeScene" class="scene scene-home" aria-hidden="true"></div><div class="shade shade-home" aria-hidden="true"></div>
    <header id="homeHeader" class="hud-top"><div><span id="dayLabel">一緒に 1日目</span><strong id="petNameTitle">こむぎ</strong></div><button id="memoryButton" type="button" aria-label="思い出を見る">記</button></header>
    <button id="catZone" class="cat-zone home-cat-zone" type="button" aria-label="こむぎを撫でる"></button><button id="windowZone" class="hotspot window-zone" type="button" aria-label="窓を見る"></button><button id="bedZone" class="hotspot bed-zone" type="button" aria-label="寝床を見る"></button><button id="bowlZone" class="hotspot bowl-zone" type="button" aria-label="ごはんを置く"></button><button id="toyZone" class="hotspot toy-zone" type="button" aria-label="おもちゃで遊ぶ"></button>
    <div id="touchBloom" class="touch-bloom" hidden></div><div id="microMessage" class="micro-message" hidden></div><div id="firstHint" class="first-hint">猫や部屋の物へ直接触れてください。</div>
  </section>
  <div id="backdrop" class="backdrop" hidden></div>
  <section id="foodSheet" class="sheet bottom-sheet" hidden><div class="sheet-head"><div><p class="kicker">食器へ置く</p><h2>今のごはん</h2></div><button data-close type="button">×</button></div><div class="food-list"><button data-food="daily" type="button"><strong>いつものごはん</strong><small>朝と夜の基本</small></button><button data-food="special" type="button"><strong>香りの強いごはん</strong><small>少し特別な日</small></button><button data-food="treat" type="button"><strong>ひとくちだけ</strong><small>主食の代わりにはしない</small></button></div></section>
  <section id="memorySheet" class="sheet bottom-sheet" hidden><div class="sheet-head"><div><p class="kicker">MEMORY</p><h2>一緒に過ごした記録</h2></div><button data-close type="button">×</button></div><div id="memoryList" class="memory-list"></div></section>
  <section id="creatorSheet" class="sheet bottom-sheet" hidden><div class="sheet-head"><div><p class="kicker">CREATOR</p><h2>検証メニュー</h2></div><button data-close type="button">×</button></div><div class="creator-meta"><span>0.6.0</span><span id="debugTime">--:--</span><span id="debugState">保存 正常</span></div><div class="creator-grid"><button data-time="3600000" type="button">+1時間</button><button data-time="21600000" type="button">+6時間</button><button data-time="86400000" type="button">+1日</button><button data-time="2592000000" type="button">+30日</button><button data-debug="hungry" type="button">空腹</button><button data-debug="sleep" type="button">就寝</button><button data-debug="reset-time" type="button">実時間</button><button data-debug="reset" type="button">最初から</button></div><details><summary>生活時間</summary><div class="routine-grid"><label>朝食<input id="settingsBreakfast" type="time"></label><label>夕食<input id="settingsDinner" type="time"></label><label>起床<input id="settingsWake" type="time"></label><label>就寝<input id="settingsBedtime" type="time"></label></div><button id="saveRoutine" class="secondary" type="button">変更を保存</button></details></section>
</div>
<script type="module" src="./src/app.js"></script>
</body>
</html>
