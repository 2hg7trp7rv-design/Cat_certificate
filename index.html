  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#2d2926;background:#ded7ce;font-synthesis:none;--ink:#302b28;--muted:#7e7770;--paper:#f7f2eb;--line:rgba(67,57,50,.12);--cream:#ecd8bf;--apricot:#dc9b65;--smoke:#777b80;--sage:#899f8e;--night:#364052;--shadow:0 24px 70px rgba(44,37,32,.18)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;overscroll-behavior:none}body{display:grid;place-items:center;background:radial-gradient(circle at 50% -10%,#f3eee8 0,#ded7ce 52%,#cfc7bd 100%);overflow:hidden}.app{position:relative;width:min(100vw,460px);height:100dvh;max-height:960px;min-height:620px;overflow:hidden;background:var(--paper);box-shadow:var(--shadow);isolation:isolate}.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 18px calc(16px + env(safe-area-inset-bottom));transition:opacity .3s ease,transform .3s ease}.hidden{opacity:0;pointer-events:none;transform:translateY(12px)}button,input{font:inherit}button{border:0}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:800;color:#8a8179;text-transform:uppercase}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em}.mark{width:34px;height:34px;border-radius:12px;background:#2f2a27;color:white;display:grid;place-items:center;font-size:17px;box-shadow:0 8px 18px rgba(47,42,39,.18)}h1,h2,p{margin:0}.intro{gap:18px}.intro-head{display:flex;justify-content:space-between;align-items:center}.intro-copy{margin-top:4vh}.intro h1{font-size:clamp(32px,9vw,46px);line-height:1.08;letter-spacing:-.055em}.intro-copy p{margin-top:13px;color:var(--muted);font-size:14px;line-height:1.8}.pet-picker{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pet-card{position:relative;min-height:178px;border:1px solid var(--line);border-radius:28px;background:#fffaf4;padding:13px;overflow:hidden;box-shadow:0 12px 34px rgba(63,52,44,.07);text-align:left;color:var(--ink);transition:.2s}.pet-card.selected{outline:3px solid rgba(66,58,52,.8);transform:translateY(-2px)}.pet-card strong{position:absolute;left:16px;bottom:15px;font-size:18px}.mini-pet{height:132px;display:grid;place-items:center}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field.wide{grid-column:1/-1}.field label{font-size:11px;font-weight:800;color:#766e68}.field input{width:100%;height:48px;border:1px solid var(--line);border-radius:15px;background:#fff;padding:0 14px;color:var(--ink);outline:none}.primary{height:56px;border-radius:18px;background:#312c29;color:white;font-weight:800;box-shadow:0 13px 30px rgba(49,44,41,.22)}.intro .primary{margin-top:auto}.home{padding-left:14px;padding-right:14px}.home-head{display:flex;align-items:center;justify-content:space-between;padding:0 5px 12px}.clock{font-size:12px;font-weight:800;color:#7f7770}.icon-btn{width:44px;height:44px;border-radius:16px;background:rgba(255,255,255,.72);box-shadow:0 6px 18px rgba(55,46,40,.08);font-size:18px;color:var(--ink)}.room{position:relative;flex:1;min-height:0;border-radius:32px;overflow:hidden;background:linear-gradient(180deg,#eee1d1 0 58%,#c7aa87 58% 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),0 14px 42px rgba(65,52,43,.10);transition:background .8s}.room.morning{background:linear-gradient(180deg,#f4dfc3 0 58%,#c9a884 58% 100%)}.room.day{background:linear-gradient(180deg,#eae4d5 0 58%,#c1a17f 58% 100%)}.room.evening{background:linear-gradient(180deg,#deb89f 0 58%,#a97d62 58% 100%)}.room.night{background:linear-gradient(180deg,#525d71 0 58%,#66574f 58% 100%);color:white}.window{position:absolute;top:23px;left:26px;width:116px;height:148px;border:9px solid rgba(255,252,246,.82);border-radius:57px 57px 10px 10px;background:linear-gradient(#bcd7df,#e9d9b9);box-shadow:0 6px 16px rgba(70,57,49,.12)}.night .window{background:linear-gradient(#1f2a43,#69728b)}.window:before,.window:after{content:"";position:absolute;background:rgba(255,255,255,.72)}.window:before{left:50%;top:0;bottom:0;width:5px;transform:translateX(-50%)}.window:after{left:0;right:0;top:50%;height:5px}.plant{position:absolute;right:25px;top:66px;width:53px;height:85px}.plant:before{content:"";position:absolute;left:16px;bottom:0;width:27px;height:34px;border-radius:5px 5px 15px 15px;background:#8d6a50}.plant:after{content:"";position:absolute;left:-4px;top:0;width:64px;height:54px;border-radius:48% 52% 44% 56%;background:radial-gradient(ellipse at 22% 65%,#728a71 0 24%,transparent 26%),radial-gradient(ellipse at 68% 34%,#8fa28a 0 26%,transparent 28%),radial-gradient(ellipse at 54% 76%,#607963 0 28%,transparent 30%)}.shelf{position:absolute;right:26px;top:166px;width:94px;height:10px;border-radius:8px;background:#9d7659;box-shadow:0 15px 0 -2px #b58b69}.bed{position:absolute;left:24px;bottom:31px;width:126px;height:53px;border-radius:50%;background:#b77e62;box-shadow:inset 0 8px 0 rgba(255,255,255,.18),0 9px 18px rgba(62,44,33,.18)}.bowl{position:absolute;right:28px;bottom:25px;width:62px;height:24px;border-radius:6px 6px 28px 28px;background:#f5eee3;border:3px solid rgba(63,55,49,.13)}.pet-stage{position:absolute;inset:22% 3% 10%;display:grid;place-items:center;touch-action:none}.pet-wrap{position:relative;width:min(72vw,310px);height:min(72vw,310px);display:grid;place-items:center;transform-origin:50% 86%;transition:transform .45s cubic-bezier(.2,.8,.2,1),filter .3s}.pet-wrap.happy{animation:bounce .55s ease}.pet-wrap.playing{animation:play .8s ease-in-out infinite alternate}.pet-wrap.sleeping{transform:scale(.92) translateY(22px)}.pet-wrap.hungry{filter:saturate(.78)}@keyframes bounce{50%{transform:translateY(-13px) scale(1.025)}}@keyframes play{to{transform:translateX(16px) rotate(2deg)}}.pet-shadow{position:absolute;width:68%;height:12%;bottom:14%;border-radius:50%;background:rgba(56,43,35,.18);filter:blur(4px)}.pet-svg{position:relative;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 13px 10px rgba(55,40,31,.16))}.pet-svg .blink{transform-origin:center;animation:blink 5s infinite}.sleeping .pet-svg .blink{transform:scaleY(.12)}@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}.bubble{position:absolute;left:17px;right:17px;top:18px;z-index:3;padding:13px 15px;border-radius:18px;background:rgba(255,255,255,.82);backdrop-filter:blur(16px);box-shadow:0 9px 26px rgba(52,44,38,.10);font-size:13px;line-height:1.55}.night .bubble{background:rgba(38,45,61,.72)}.stage-label{position:absolute;left:19px;bottom:15px;font-size:11px;font-weight:800;padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.7);backdrop-filter:blur(10px)}.night .stage-label{background:rgba(30,36,49,.62)}.status-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 2px 0}.status{padding:10px 9px;border-radius:15px;background:#fff;border:1px solid var(--line)}.status span{font-size:10px;color:#837b74;display:block}.status strong{font-size:13px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.action{height:62px;border-radius:18px;background:#fff;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px solid var(--line);box-shadow:0 7px 18px rgba(56,47,41,.06);font-size:10px;font-weight:800}.action b{font-size:20px}.sheet-backdrop{position:absolute;inset:0;z-index:10;background:rgba(38,32,29,.25);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.25s}.sheet-backdrop.open{opacity:1;pointer-events:auto}.sheet{position:absolute;left:10px;right:10px;bottom:10px;z-index:11;padding:18px;border-radius:28px;background:#fbf7f1;box-shadow:0 26px 70px rgba(37,31,27,.3);transform:translateY(calc(100% + 24px));transition:.32s cubic-bezier(.2,.8,.2,1)}.sheet.open{transform:translateY(0)}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sheet h2{font-size:20px}.food-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.food{height:96px;border-radius:19px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;font-weight:800;font-size:11px}.food b{font-size:28px}.debug{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.debug button{height:48px;border-radius:15px;background:#fff;border:1px solid var(--line);font-weight:800;color:var(--ink)}.note{margin-top:12px;color:#847c75;font-size:11px;line-height:1.6}.toast{position:absolute;z-index:20;left:24px;right:24px;bottom:calc(92px + env(safe-area-inset-bottom));padding:13px 15px;border-radius:16px;background:#302b28;color:white;font-size:12px;font-weight:700;box-shadow:0 15px 35px rgba(44,37,32,.28);animation:toast .25s ease}@keyframes toast{from{opacity:0;transform:translateY(9px)}}
  </style>
</head>
<body>
<div class="app" id="app">
  <section class="screen intro" id="intro">
    <div class="intro-head"><div class="brand"><div class="mark">⌁</div>TAIL ROOM</div><span class="eyebrow">Creator preview</span></div>
    <div class="intro-copy"><span class="eyebrow">かわいい姿、本物に近い暮らし</span><h1>あなたの毎日に、<br>しっぽのいる部屋。</h1><p>現実の時刻に合わせて食べ、眠り、少しずつ成長する猫や犬と暮らすための確認版です。</p></div>
    <div class="pet-picker">
      <button class="pet-card selected" data-kind="cat"><div class="mini-pet" id="miniCat"></div><strong>猫と暮らす</strong></button>
      <button class="pet-card" data-kind="dog"><div class="mini-pet" id="miniDog"></div><strong>犬と暮らす</strong></button>
    </div>
    <div class="form-grid">
      <div class="field wide"><label>ペットの名前</label><input id="petName" value="こむぎ" maxlength="10"></div>
      <div class="field"><label>朝ごはん</label><input id="breakfast" type="time" value="07:30"></div>
      <div class="field"><label>夜ごはん</label><input id="dinner" type="time" value="19:00"></div>
      <div class="field"><label>起きる時間</label><input id="wake" type="time" value="07:00"></div>
      <div class="field"><label>寝る時間</label><input id="bedtime" type="time" value="23:30"></div>
    </div>
    <button class="primary" id="start">この子との暮らしを始める</button>
  </section>
  <section class="screen home hidden" id="home">
    <header class="home-head"><div><div class="eyebrow" id="phaseText">Morning room</div><div class="brand"><span id="titleName">こむぎ</span><span class="clock" id="clock">00:00</span></div></div><button class="icon-btn" id="settings" aria-label="制作者設定">•••</button></header>
    <main class="room morning" id="room">
      <div class="window"></div><div class="plant"></div><div class="shelf"></div><div class="bed"></div><div class="bowl" id="bowl"></div>
      <div class="bubble" id="message">新しい部屋を、ゆっくり確かめています。</div>
      <div class="pet-stage" id="petStage"><div class="pet-wrap" id="petWrap"><div class="pet-shadow"></div><div id="petArt"></div></div></div>
      <div class="stage-label" id="growthLabel">子猫期・1日目</div>
    </main>
    <div class="status-row"><div class="status"><span>おなか</span><strong id="foodStatus">満足そう</strong></div><div class="status"><span>いま</span><strong id="sleepStatus">起きている</strong></div><div class="status"><span>一緒に</span><strong id="daysStatus">1日目</strong></div></div>
    <nav class="actions"><button class="action" data-action="feed"><b>◒</b>ごはん</button><button class="action" data-action="pet"><b>⌁</b>なでる</button><button class="action" data-action="play"><b>◌</b>あそぶ</button><button class="action" data-action="walk"><b>↗</b><span id="walkLabel">探索</span></button></nav>
  </section>
  <div class="sheet-backdrop" id="backdrop"></div>
  <aside class="sheet" id="foodSheet"><div class="sheet-head"><h2>ごはんを置く</h2><button class="icon-btn" data-close>×</button></div><div class="food-grid"><button class="food" data-food="daily"><b>🥣</b>いつもの</button><button class="food" data-food="special"><b>🐟</b>特別な日</button><button class="food" data-food="treat"><b>◍</b>おやつ</button></div><p class="note">食事を置くと、予定していた空腹通知は解除された扱いになります。</p></aside>
  <aside class="sheet" id="debugSheet"><div class="sheet-head"><h2>制作者用の時間確認</h2><button class="icon-btn" data-close>×</button></div><div class="debug"><button data-time="21600000">+6時間</button><button data-time="86400000">+1日</button><button data-time="2592000000">+30日</button><button data-time="reset">実時間へ戻す</button><button id="notify">通知を試す</button><button id="restart">最初から</button></div><p class="note">このパネルは制作確認用です。App Store版には含めません。</p></aside>
</div>
<script>
(()=>{
const KEY='tail-room-preview-v3',DAY=864e5,HOUR=36e5,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const defaults={onboarded:false,kind:'cat',name:'こむぎ',createdAt:Date.now(),lastFedAt:Date.now(),breakfast:'07:30',dinner:'19:00',wake:'07:00',bedtime:'23:30',offset:0,fullness:86,bond:12};
let state=load(),activity='idle',sheet=null,petting=false,lastPoint=null;
function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return {...defaults}}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function now(){return Date.now()+Number(state.offset||0)}function mins(t){let [h,m]=t.split(':').map(Number);return h*60+m}function clockMin(d){return d.getHours()*60+d.getMinutes()}function betweenNight(cur,bed,wake){return bed>wake?cur>=bed||cur<wake:cur>=bed&&cur<wake}function phase(d){let h=d.getHours();return h>=5&&h<10?'morning':h>=10&&h<17?'day':h>=17&&h<21?'evening':'night'}function days(){return Math.max(1,Math.floor((now()-state.createdAt)/DAY)+1)}function growth(){let d=days();return d<30?['baby',state.kind==='cat'?'子猫期':'子犬期',.82]:d<75?['growing','育ちざかり',.9]:d<120?['young','若い時期',.96]:['adult','おとな',1]}
function lastMealDue(){let d=new Date(now()),cur=clockMin(d),b=mins(state.breakfast),n=mins(state.dinner),base=new Date(d);base.setHours(0,0,0,0);let due;if(cur>=n)due=base.getTime()+n*6e4;else if(cur>=b)due=base.getTime()+b*6e4;else due=base.getTime()-DAY+n*6e4;return due}function hungry(){let due=lastMealDue();return now()-due>=30*6e4&&state.lastFedAt<due}function sleeping(){let d=new Date(now());return betweenNight(clockMin(d),mins(state.bedtime),mins(state.wake))}function coat(){return state.kind==='cat'?['#ead5b6','#c19063','#755b4d']:['#e8cfaa','#b98659','#6c5146']}
function petSvg(kind=state.kind,small=false){let c=coat(),sleep=sleeping(),eye=sleep?`<path d="M91 109q10 7 20 0M151 109q10 7 20 0" fill="none" stroke="#3b302c" stroke-width="5" stroke-linecap="round"/>`:`<g class="blink"><ellipse cx="101" cy="108" rx="8" ry="11" fill="#322a27"/><ellipse cx="161" cy="108" rx="8" ry="11" fill="#322a27"/><circle cx="98" cy="104" r="2.4" fill="white"/><circle cx="158" cy="104" r="2.4" fill="white"/></g>`;let ears=kind==='cat'?`<path d="M67 91L75 39l38 36M195 91l-8-52-38 36" fill="${c[1]}" stroke="#4f4039" stroke-width="6" stroke-linejoin="round"/><path d="M78 69l4-18 17 19M184 69l-4-18-17 19" fill="#eeb9ac"/>`:`<path d="M72 78q-34-29-39 13 5 38 43 31M190 78q34-29 39 13-5 38-43 31" fill="${c[1]}" stroke="#4f4039" stroke-width="6"/>`;return `<svg class="pet-svg" viewBox="0 0 262 280" aria-label="${kind==='cat'?'猫':'犬'}"><path d="M95 172q-43 16-47 61 34 28 83 8 49 20 83-8-4-45-47-61" fill="${c[1]}" stroke="#4f4039" stroke-width="7"/><ellipse cx="131" cy="126" rx="72" ry="66" fill="${c[0]}" stroke="#4f4039" stroke-width="7"/>${ears}${eye}<path d="M123 128q8-7 16 0-8 10-16 0" fill="#9e665e"/><path d="M131 139q-1 12-16 13M131 139q1 12 16 13" fill="none" stroke="#4f4039" stroke-width="4" stroke-linecap="round"/><ellipse cx="78" cy="136" rx="13" ry="7" fill="#eab5a8" opacity=".55"/><ellipse cx="184" cy="136" rx="13" ry="7" fill="#eab5a8" opacity=".55"/><path d="M96 177q35 22 70 0" fill="${c[0]}" opacity=".92"/><ellipse cx="90" cy="237" rx="29" ry="18" fill="${c[0]}" stroke="#4f4039" stroke-width="6"/><ellipse cx="172" cy="237" rx="29" ry="18" fill="${c[0]}" stroke="#4f4039" stroke-width="6"/>${kind==='cat'?`<path d="M199 208q53-13 27-59" fill="none" stroke="${c[1]}" stroke-width="18" stroke-linecap="round"/>`:`<path d="M199 201q42-29 39 7" fill="none" stroke="${c[1]}" stroke-width="18" stroke-linecap="round"/>`}</svg>`}
function renderMini(){let old=state.kind;state.kind='cat';$('#miniCat').innerHTML=petSvg('cat',true);state.kind='dog';$('#miniDog').innerHTML=petSvg('dog',true);state.kind=old}
function render(){let d=new Date(now()),ph=phase(d),isHungry=hungry(),isSleep=sleeping(),g=growth();$('#clock').textContent=d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});$('#phaseText').textContent={morning:'MORNING ROOM',day:'DAY ROOM',evening:'EVENING ROOM',night:'NIGHT ROOM'}[ph];$('#room').className='room '+ph;$('#titleName').textContent=state.name;$('#petArt').innerHTML=petSvg();$('#petWrap').style.transform=`scale(${g[2]})`;$('#petWrap').className='pet-wrap '+(isSleep?'sleeping':isHungry?'hungry':activity);$('#growthLabel').textContent=`${g[1]}・${days()}日目`;$('#foodStatus').textContent=isHungry?'お腹が空いた':state.fullness>70?'満足そう':'少し気になる';$('#sleepStatus').textContent=isSleep?'一緒に眠る':'起きている';$('#daysStatus').textContent=`${days()}日目`;$('#walkLabel').textContent=state.kind==='dog'?'散歩':'探索';let msg=isSleep?`${state.name}は、あなたの生活リズムに合わせて静かに眠っています。`:isHungry?`${state.name}は空のお皿を確認しています。ごはんの時間を少し過ぎたようです。`:activity==='happy'?`${state.name}は目を細め、もう一度触れてほしそうに近づきました。`:activity==='playing'?(state.kind==='dog'?`${state.name}はしっぽを振って遊びに夢中です。`:`${state.name}は狙いを定め、前足でおもちゃを押さえました。`):`${state.name}は部屋で自分の時間を過ごしながら、あなたの気配を感じています。`;$('#message').textContent=msg;$('#bowl').style.boxShadow=isHungry?'0 0 0 5px rgba(255,225,170,.65)':'none'}
function toast(t){document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.textContent=t;$('.app').append(e);setTimeout(()=>e.remove(),2600)}function setActivity(a,t=1100){activity=a;render();setTimeout(()=>{activity='idle';render()},t)}function openSheet(id){sheet=id;$('#backdrop').classList.add('open');$(id).classList.add('open')}function closeSheet(){if(sheet)$(sheet).classList.remove('open');$('#backdrop').classList.remove('open');sheet=null}
$$('.pet-card').forEach(b=>b.onclick=()=>{$$('.pet-card').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');state.kind=b.dataset.kind;$('#petName').value=state.kind==='cat'?'こむぎ':'むぎ';renderMini()});$('#start').onclick=()=>{state={...state,onboarded:true,kind:state.kind,name:$('#petName').value.trim()||'こむぎ',breakfast:$('#breakfast').value,dinner:$('#dinner').value,wake:$('#wake').value,bedtime:$('#bedtime').value,createdAt:now(),lastFedAt:now(),fullness:86};save();$('#intro').classList.add('hidden');$('#home').classList.remove('hidden');render();toast(`${state.name}との暮らしが始まりました`)};$$('[data-action]').forEach(b=>b.onclick=()=>{let a=b.dataset.action;if(a==='feed')return openSheet('#foodSheet');if(a==='pet'){state.bond=Math.min(100,state.bond+2);save();setActivity('happy');toast(`${state.name}をやさしく撫でました`)}else if(a==='play'){setActivity('playing',1800);toast(state.kind==='dog'?'ボールを追いかけています':'おもちゃを狙っています')}else{setActivity('playing',2100);toast(state.kind==='dog'?'近所を短く散歩しました':'部屋の気になる場所を探索しました')}});$$('[data-food]').forEach(b=>b.onclick=()=>{state.lastFedAt=now();state.fullness=100;save();closeSheet();setActivity('happy');toast(`${state.name}がごはんを食べ始めました`)});$('#settings').onclick=()=>openSheet('#debugSheet');$$('[data-close]').forEach(b=>b.onclick=closeSheet);$('#backdrop').onclick=closeSheet;$$('[data-time]').forEach(b=>b.onclick=()=>{state.offset=b.dataset.time==='reset'?0:state.offset+Number(b.dataset.time);save();render();toast(b.dataset.time==='reset'?'実際の時刻へ戻しました':'確認用の時間を進めました')});$('#restart').onclick=()=>{localStorage.removeItem(KEY);location.reload()};$('#notify').onclick=async()=>{if(!('Notification'in window))return toast('このブラウザーでは通知を確認できません');let p=Notification.permission==='default'?await Notification.requestPermission():Notification.permission;if(p==='granted')new Notification('Tail Room',{body:`${state.name}がお皿を確認しています。ごはんの時間のようです。`});else toast('通知は許可されませんでした')};
let stage=$('#petStage');stage.addEventListener('pointerdown',e=>{petting=true;lastPoint=[e.clientX,e.clientY];stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(!petting)return;let d=Math.hypot(e.clientX-lastPoint[0],e.clientY-lastPoint[1]);if(d>18){lastPoint=[e.clientX,e.clientY];activity='happy';render()}});stage.addEventListener('pointerup',()=>{if(petting){petting=false;state.bond=Math.min(100,state.bond+1);save();setActivity('happy');toast(`${state.name}が手の動きに身体を預けました`)}});
renderMini();if(state.onboarded){$('#intro').classList.add('hidden');$('#home').classList.remove('hidden')}render();setInterval(render,30000);
})();
</script>
